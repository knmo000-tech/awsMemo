<rect x="35" y="1460" width="2650" height="130" rx="14" fill="#eaf3fc" stroke="#c3d7e8" stroke-width="2"/>
<text x="60" y="1497" font-size="24" fill="#244b6e" font-weight="700">認証・受付・照会の流れ</text>
<text x="60" y="1533" font-size="21" fill="#244b6e" font-weight="400">① 保守キー照合 → 不透明トークン発行・Sessions保存   ② トークン検証 → 入力保存案 → Jobs・冪等性・残量・Outbox登録案 → 202</text>
<text x="60" y="1569" font-size="21" fill="#244b6e" font-weight="400">③ トークン・所有者を再確認 → 状態／成功時の署名URLを返す   ④ S3からJSON取得。発行済みURLはセッション失効だけでは無効にならない。</text>
<rect x="35" y="1610" width="1300" height="175" rx="14" fill="#f6f1fc" stroke="#baa7ce" stroke-width="2"/>
<text x="60" y="1647" font-size="23" fill="#244b6e" font-weight="700">凡例・提案の範囲</text>
<text x="60" y="1682" font-size="20" fill="#244b6e" font-weight="400">青実線：業務通信・データ操作  ／  紫破線：応答・関連付け・配送提案等</text>
<text x="60" y="1715" font-size="20" fill="#244b6e" font-weight="400">紫の枠：採否未決。SQS・Outbox・入力保存・予約精算・試行別成果物は提案。</text>
<text x="60" y="1748" font-size="20" fill="#244b6e" font-weight="400">Web入口も最終選定前。JWT署名鍵は不要。追加CMKは採らない既存方針を継続。</text>
<rect x="1360" y="1610" width="1325" height="175" rx="14" fill="#f3f7fa" stroke="#b8cbd8" stroke-width="2"/>
<text x="1385" y="1647" font-size="23" fill="#244b6e" font-weight="700">追跡・監視と図の対象</text>
<text x="1385" y="1682" font-size="20" fill="#244b6e" font-weight="400">入口のX-Amz-Cf-Idをアプリログにも記録。jobIdを配送・Workerまで引き継ぐ。</text>
<text x="1385" y="1715" font-size="20" fill="#244b6e" font-weight="400">CloudWatch / CloudTrail / GuardDutyは利用計画。保持・通知等は別途設計。</text>
<text x="1385" y="1748" font-size="20" fill="#244b6e" font-weight="400">認証情報・入力本文・署名URLはログに出さない。復旧・請求条件はcurrentを参照。</text>
<text x="40" y="1818" font-size="18" fill="#6b8195" font-weight="400">正本：docs/current/入口方式比較.md・構成設計.md  |  rev4の業務フロー図相当の粒度でWeb案を可視化（既存図は履歴として保持）</text>
