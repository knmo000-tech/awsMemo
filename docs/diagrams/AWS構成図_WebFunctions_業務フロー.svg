<title id="title">AWS Web Functions案：業務処理とデータの流れ</title><desc id="desc">WPFからCloudFrontとWAF、OAC経由でWeb Functionに接続。不透明トークンとDynamoDBで認証。提案のOutbox、配送Event Function、SQSから生成Workerを実行し、BedrockのJSONをS3へ保存する。</desc>
